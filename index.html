<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدليات وليد حمدي — اطلب أونلاين</title>
<meta name="description" content="اطلب أدويتك ومستلزماتك من صيدليات وليد حمدي ويوصلك لحد البيت — الطلب على واتساب.">
<meta property="og:title" content="صيدليات وليد حمدي — اطلب أونلاين">
<meta property="og:description" content="اختار طلبك وابعته على واتساب في ثواني 💊">
<meta name="theme-color" content="#0B7A63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0B7A63; --brand-2:#0FA37F; --brand-soft:#E6F4F1;
    --accent:#F26B1D; --ink:#1B1F23; --muted:#6B7280; --line:#ECEDEF;
    --tile:#F4F5F6; --bg:#FFFFFF; --wa:#25D366;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif}
  body{padding-bottom:96px}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid transparent;transition:border-color .2s}
  header.scrolled{border-color:var(--line)}
  .top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
  .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
        color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;flex:none;overflow:hidden;border:1px solid var(--line)}
  .logo img{width:100%;height:100%;object-fit:cover}
  .title{flex:1;min-width:0}
  .title h1{margin:0;font-size:19px;font-weight:800;line-height:1.3}
  .title p{margin:0;color:var(--muted);font-size:12.5px}
  .open{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--brand);background:var(--brand-soft);
        padding:1px 9px;border-radius:99px;font-weight:700;margin-inline-start:4px;vertical-align:middle}
  .open::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand-2)}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;font-size:20px;color:var(--ink)}
  .search{position:relative;padding-bottom:12px}
  .search input{width:100%;height:50px;border-radius:99px;border:1px solid #E3E5E8;background:var(--tile);
                padding:0 48px 0 44px;outline:none;transition:.15s}
  .search input:focus{background:#fff;border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(15,163,127,.12)}
  .search svg{position:absolute;right:16px;top:14px;color:var(--muted)}
  .search .clear{position:absolute;left:8px;top:7px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:18px;display:none}

  /* Rx banner */
  .rx{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
      border-radius:var(--r);padding:14px 16px;margin:6px 0 4px;border:0;width:100%;text-align:right}
  .rx .em{font-size:30px}
  .rx b{display:block;font-size:16px}
  .rx span{font-size:13px;opacity:.92}
  .rx .go{margin-inline-start:auto;background:#fff;color:var(--brand);border-radius:99px;padding:6px 14px;font-weight:800;font-size:13px;white-space:nowrap}

  h2{font-size:21px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  h2 a,h2 button.link{font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;background:none;border:0;padding:0}

  /* Categories */
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
  .cat{background:none;border:0;padding:0;text-align:center;color:var(--ink);display:flex;flex-direction:column;justify-content:flex-start}
  .cat .ic{aspect-ratio:1;border-radius:var(--r);display:grid;place-items:center;font-size:clamp(30px,9vw,46px);transition:transform .15s}
  .cat:active .ic{transform:scale(.95)}
  .cat .nm{font-size:13.5px;font-weight:600;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cat.on .ic{outline:2.5px solid var(--brand-2);outline-offset:-2.5px}

  /* Products */
  .row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row .card{flex:0 0 42%;scroll-snap-align:start}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.row .card{flex-basis:30%}}
  .card{min-width:0}
  .card .pic{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:var(--r);background:#fff;display:grid;place-items:center;font-size:56px;overflow:hidden}
  .card .pic img{width:85%;height:85%;object-fit:contain}
  .card .nm{font-size:14px;font-weight:600;line-height:1.45;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
  .card .pr{font-weight:800;font-size:15.5px}
  .add{position:absolute;left:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;
       color:var(--accent);font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .stepper{position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:99px;background:var(--accent);color:#fff;
           display:flex;align-items:center;justify-content:space-between;padding:0 4px;box-shadow:0 4px 12px rgba(242,107,29,.35)}
  .stepper button{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:700}
  .stepper b{font-size:16px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}
  .empty button{margin-top:10px}

  .ask{margin:26px 0 8px;border:1.5px dashed #CFD5DA;border-radius:var(--r);padding:16px;text-align:center}
  .ask p{margin:0 0 10px;font-weight:700}
  .btn{height:50px;border-radius:99px;border:0;padding:0 22px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.ghost{background:var(--brand-soft);color:var(--brand)}
  .btn.wa{background:var(--wa);color:#fff;width:100%}
  .btn.wa:disabled{background:#B9C2C9}
  .info{color:var(--muted);font-size:13px;text-align:center;margin:28px 0 8px;line-height:1.9}

  /* Bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  .bar .wrap{display:flex;flex-direction:column;gap:8px}
  .bar .msg{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
  .prog{height:6px;background:#E6E8EB;border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--brand-2);border-radius:99px;transition:width .3s}
  .cartbtn{display:none;width:100%;height:54px;border:0;border-radius:99px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;
           align-items:center;justify-content:space-between;padding:0 8px 0 20px}
  .cartbtn .n{background:#fff;color:var(--brand);border-radius:99px;min-width:38px;height:38px;display:grid;place-items:center;padding:0 10px}
  .bar.has .cartbtn{display:flex}

  /* Sheet */
  .shade{position:fixed;inset:0;background:rgba(15,20,25,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;
         display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
  .open-sheet .shade{opacity:1;pointer-events:auto}
  .open-sheet .sheet{transform:none}
  .sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet .hd h3{margin:0;font-size:19px}
  .sheet .bd{overflow-y:auto;padding:6px 16px 16px;flex:1}
  .sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .line .th{width:54px;height:54px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
  .line .th img{width:100%;height:100%;object-fit:contain}
  .line .tx{flex:1;min-width:0;font-size:14px;font-weight:600}
  .line .tx small{display:block;color:var(--muted);font-weight:600}
  .mini{display:flex;align-items:center;gap:6px;background:var(--tile);border-radius:99px;padding:3px}
  .mini button{width:32px;height:32px;border-radius:50%;border:0;background:#fff;font-size:18px;font-weight:700;color:var(--ink)}
  .mini b{min-width:20px;text-align:center}
  .sum{margin:14px 0 4px;font-size:15px}
  .sum div{display:flex;justify-content:space-between;padding:4px 0}
  .sum .tot{font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
  label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  .f{width:100%;border:1px solid #DDE1E5;border-radius:14px;padding:12px 14px;outline:none;background:#fff;color:var(--ink)}
  .f:focus{border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(15,163,127,.12)}
  textarea.f{min-height:84px;resize:vertical}
  .pay{display:flex;gap:8px}
  .pay label{flex:1;margin:0;border:1px solid #DDE1E5;border-radius:14px;padding:11px 8px;text-align:center;font-weight:600;font-size:14px;cursor:pointer}
  .pay input{display:none}
  .pay input:checked+span{color:var(--brand)}
  .pay label:has(input:checked){border-color:var(--brand-2);background:var(--brand-soft)}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
  .err{color:#C62828;font-size:13px;margin-top:6px;display:none}
  .toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;
         border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap">
    <div class="top">
      <div class="logo" id="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></div>
      <div class="title">
        <h1 id="storeName">صيدليات وليد حمدي</h1>
        <p><span id="hours"></span></p>
      </div>
      <button class="iconbtn" id="callBtn" aria-label="كلّمنا على واتساب">💬</button>
    </div>
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث عن دواء أو منتج..." autocomplete="off">
      <button class="clear" id="clearQ" aria-label="مسح">✕</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="bar" id="bar">
  <div class="wrap">
    <button class="cartbtn" id="openCart"><span>عرض السلة · <span id="barTotal"></span></span><span class="n" id="barCount">0</span></button>
    <div class="msg" id="barMsg">🛍️ <span id="barText"></span></div>
    <div class="prog"><i id="barProg"></i></div>
  </div>
</div>

<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="hd"><h3>طلبك</h3><button class="iconbtn" id="closeCart" aria-label="إغلاق">✕</button></div>
  <div class="bd" id="cartBody"></div>
  <div class="ft">
    <button class="btn wa" id="sendBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4.1 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>
      إرسال الطلب على واتساب
    </button>
    <div class="err" id="err"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(() => {
  const S = window.STORE, CATS = window.CATEGORIES, P = window.PRODUCTS;
  const $ = s => document.querySelector(s);
  const fmt = n => n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + S.currency;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const norm = s => String(s).toLowerCase()
      .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[ً-ْ]/g, "");

  /* ---------- state ---------- */
  const store = {
    get(k, d){ try { return JSON.parse(localStorage.getItem("wh_" + k)) ?? d; } catch { return d; } },
    set(k, v){ try { localStorage.setItem("wh_" + k, JSON.stringify(v)); } catch {} }
  };
  let cart = store.get("cart", {});           // {id: qty}
  for (const id in cart) if (!byId[id]) delete cart[id];
  let view = {cat: null, q: ""};
  const form = store.get("form", {name: "", phone: "", area: "", address: "", notes: "", pay: "كاش عند الاستلام"});

  /* ---------- header ---------- */
  document.title = S.name + " — اطلب أونلاين";
  $("#storeName").innerHTML = esc(S.name) + ' <span class="open">توصيل</span>';
  $("#hours").textContent = S.workingHours;
  if (S.logo) $("#logo").innerHTML = `<img src="${esc(S.logo)}" alt="">`;
  addEventListener("scroll", () => $("#hdr").classList.toggle("scrolled", scrollY > 4), {passive: true});

  const waLink = text => `https://wa.me/${S.whatsapp}?text=${encodeURIComponent(text)}`;
  $("#callBtn").onclick = () => open(waLink(`السلام عليكم، عندي استفسار لـ ${S.name}`), "_blank");

  /* ---------- rendering ---------- */
  const pic = (p, cls = "") => p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : (p.icon || "💊");

  function card(p){
    const q = cart[p.id] || 0;
    const ctl = q
      ? `<div class="stepper"><button data-inc="${p.id}" aria-label="زيادة">+</button><b>${q}</b><button data-dec="${p.id}" aria-label="تقليل">−</button></div>`
      : `<button class="add" data-inc="${p.id}" aria-label="إضافة ${esc(p.name)}">+</button>`;
    return `<div class="card"><div class="pic">${pic(p)}${ctl}</div>
      <div class="nm">${esc(p.name)}</div><div class="pr">${fmt(p.price)}</div></div>`;
  }

  const askBox = (text) => `<div class="ask"><p>${text}</p>
      <button class="btn ghost" data-ask>✍️ اكتب طلبك وإحنا نوفّره</button></div>`;

  function render(){
    const m = $("#main");
    const q = norm(view.q.trim());
    let html = "";

    if (q){
      const res = P.filter(p => norm(p.name).includes(q));
      html += `<h2>نتائج البحث <button class="link" data-home>رجوع</button></h2>`;
      html += res.length ? `<div class="grid">${res.map(card).join("")}</div>`
        : `<div class="empty">مش لاقيين "${esc(view.q)}" في القائمة 🤔</div>`;
      html += askBox("مش لاقي اللي بتدور عليه؟ اكتبه وإحنا نوفّرهولك");
    } else if (view.cat){
      const c = CATS.find(c => c.id === view.cat);
      const res = P.filter(p => p.cat === view.cat);
      html += `<h2>${c.icon} ${esc(c.name)} <button class="link" data-home>كل الأقسام</button></h2>`;
      html += res.length ? `<div class="grid">${res.map(card).join("")}</div>`
        : `<div class="empty">لسه مفيش منتجات هنا</div>`;
      html += askBox("محتاج حاجة تانية من القسم ده؟");
    } else {
      html += `<button class="rx" data-rx><span class="em">📋</span><span><b>عندك روشتة؟</b><span>صوّرها وابعتها وإحنا نجهّزلك الطلب</span></span><span class="go">ابعت الروشتة</span></button>`;
      html += `<h2>تسوق حسب الفئة</h2><div class="cats">` + CATS.map(c =>
        `<button class="cat" data-cat="${c.id}"><div class="ic" style="background:${c.bg}">${c.icon}</div><div class="nm">${esc(c.name)}</div></button>`
      ).join("") + `</div>`;
      const best = P.filter(p => p.best);
      if (best.length) html += `<h2>🔥 الأكثر طلبًا</h2><div class="row">${best.map(card).join("")}</div>`;
      html += `<h2>كل المنتجات</h2><div class="grid">${P.map(card).join("")}</div>`;
      html += askBox("مش لاقي الدواء اللي محتاجه؟");
      html += `<div class="info">🚚 التوصيل ${S.deliveryFee ? fmt(S.deliveryFee) : "مجاني"}${S.freeDeliveryFrom ? ` · مجاني للطلبات فوق ${fmt(S.freeDeliveryFrom)}` : ""}<br>💵 الدفع كاش عند الاستلام أو محفظة إلكترونية<br>⚠️ الأسعار قابلة للتغيير حسب التوفر</div>`;
    }
    m.innerHTML = html;
    renderBar();
  }

  /* ---------- cart math ---------- */
  const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
  const subtotal = () => Object.entries(cart).reduce((a, [id, q]) => a + byId[id].price * q, 0);
  const delivery = (sub) => (S.freeDeliveryFrom && sub >= S.freeDeliveryFrom) ? 0 : (S.deliveryFee || 0);

  function renderBar(){
    const n = count(), sub = subtotal(), bar = $("#bar");
    bar.classList.toggle("has", n > 0);
    $("#barCount").textContent = n;
    $("#barTotal").textContent = fmt(sub);
    let text, prog;
    if (sub < S.minOrder){
      text = n ? `أضف ${fmt(S.minOrder - sub)} كمان عشان تكمّل الطلب` : `تسوّق الآن وأضف ${fmt(S.minOrder)} أو أكثر إلى طلبك!`;
      prog = sub / S.minOrder;
    } else if (S.freeDeliveryFrom && sub < S.freeDeliveryFrom){
      text = `فاضلك ${fmt(S.freeDeliveryFrom - sub)} على التوصيل المجاني 🚚`;
      prog = sub / S.freeDeliveryFrom;
    } else {
      text = S.freeDeliveryFrom ? "مبروك! التوصيل مجاني 🎉" : "طلبك جاهز للإرسال ✅";
      prog = 1;
    }
    $("#barText").textContent = text;
    $("#barProg").style.width = Math.min(100, prog * 100) + "%";
  }

  function setQty(id, q){
    if (q <= 0) delete cart[id]; else cart[id] = q;
    store.set("cart", cart);
  }

  /* ---------- cart sheet ---------- */
  function renderCart(){
    const items = Object.entries(cart);
    const sub = subtotal(), del = items.length ? delivery(sub) : 0;
    let h = "";
    if (items.length){
      h += items.map(([id, q]) => { const p = byId[id]; return `
        <div class="line"><div class="th">${pic(p)}</div>
          <div class="tx">${esc(p.name)}<small>${fmt(p.price * q)}</small></div>
          <div class="mini"><button data-inc="${id}">+</button><b>${q}</b><button data-dec="${id}">−</button></div></div>`; }).join("");
      h += `<div class="sum"><div><span>المنتجات</span><span>${fmt(sub)}</span></div>
            <div><span>التوصيل</span><span>${del ? fmt(del) : "مجاني"}</span></div>
            <div class="tot"><span>الإجمالي</span><span>${fmt(sub + del)}</span></div></div>`;
    } else {
      h += `<div class="empty">السلة فاضية — تقدر تكتب طلبك بإيدك تحت 👇</div>`;
    }
    h += `
      <label for="notes">طلبات تانية أو ملاحظات</label>
      <textarea class="f" id="notes" placeholder="مثلاً: علبة كونجستال + شريط بروفين 400، أو بديل لو الدواء مش موجود">${esc(form.notes)}</textarea>
      <label for="name">الاسم</label>
      <input class="f" id="name" autocomplete="name" value="${esc(form.name)}" placeholder="اسمك">
      <label for="phone">رقم الموبايل</label>
      <input class="f" id="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" value="${esc(form.phone)}" placeholder="01xxxxxxxxx">
      <label for="area">المنطقة</label>
      <select class="f" id="area"><option value="">اختار المنطقة</option>${S.areas.map(a => `<option ${a === form.area ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
      <label for="address">العنوان بالتفصيل</label>
      <input class="f" id="address" autocomplete="street-address" value="${esc(form.address)}" placeholder="الشارع، رقم العمارة، الدور، علامة مميزة">
      <label>طريقة الدفع</label>
      <div class="pay">${["كاش عند الاستلام", "محفظة إلكترونية / إنستاباي"].map(v =>
        `<label><input type="radio" name="pay" value="${v}" ${form.pay === v ? "checked" : ""}><span>${v}</span></label>`).join("")}</div>
      <div class="note">لو عندك روشتة، ابعت صورتها في نفس محادثة الواتساب بعد إرسال الطلب 📸</div>`;
    $("#cartBody").innerHTML = h;
    $("#err").style.display = "none";
    const send = $("#sendBtn");
    send.disabled = !items.length && !form.notes.trim();
  }

  function openCart(){ renderCart(); document.body.classList.add("open-sheet"); document.body.style.overflow = "hidden"; }
  function closeCart(){ document.body.classList.remove("open-sheet"); document.body.style.overflow = ""; render(); }
  $("#openCart").onclick = openCart;
  $("#closeCart").onclick = closeCart;
  $("#shade").onclick = closeCart;
  addEventListener("keydown", e => { if (e.key === "Escape") closeCart(); });

  $("#cartBody").addEventListener("input", e => {
    const t = e.target;
    if (t.name === "pay") form.pay = t.value;
    else if (t.id in form) form[t.id] = t.value;
    store.set("form", form);
    if (t.id === "notes") $("#sendBtn").disabled = !count() && !form.notes.trim();
  });

  /* ---------- send order ---------- */
  $("#sendBtn").onclick = () => {
    const err = $("#err");
    const fail = m => { err.textContent = m; err.style.display = "block"; };
    const sub = subtotal();
    if (!count() && !form.notes.trim()) return fail("اختار منتجات أو اكتب طلبك في الملاحظات");
    if (count() && !form.notes.trim() && sub < S.minOrder) return fail(`أقل طلب ${fmt(S.minOrder)}`);
    if (!form.name.trim()) return fail("اكتب اسمك");
    if (!/^[0-9+\s]{10,15}$/.test(form.phone.trim())) return fail("اكتب رقم موبايل صحيح");
    if (!form.address.trim()) return fail("اكتب العنوان");

    const del = count() ? delivery(sub) : 0;
    const lines = Object.entries(cart).map(([id, q]) => `• ${byId[id].name} × ${q} = ${fmt(byId[id].price * q)}`);
    let msg = `🧾 *طلب جديد — ${S.name}*\n\n`;
    if (lines.length) msg += lines.join("\n") + `\n\nالمنتجات: ${fmt(sub)}\nالتوصيل: ${del ? fmt(del) : "مجاني"}\n*الإجمالي: ${fmt(sub + del)}*\n`;
    if (form.notes.trim()) msg += `\n📝 *طلبات/ملاحظات:*\n${form.notes.trim()}\n`;
    msg += `\n👤 الاسم: ${form.name.trim()}\n📞 الموبايل: ${form.phone.trim()}\n📍 العنوان: ${[form.area, form.address.trim()].filter(Boolean).join(" — ")}\n💵 الدفع: ${form.pay}`;
    open(waLink(msg), "_blank");

    cart = {}; store.set("cart", cart);
    form.notes = ""; store.set("form", form);
    closeCart();
    toast("تم فتح واتساب — اضغط إرسال ✅");
  };

  /* ---------- events ---------- */
  function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-inc],[data-dec],[data-cat],[data-home],[data-ask],[data-rx]");
    if (!b) return;
    const inSheet = !!b.closest("#sheet");
    if (b.dataset.inc){ const id = +b.dataset.inc; if (!cart[id]) toast("اتضاف للسلة 🛒"); setQty(id, (cart[id] || 0) + 1); }
    else if (b.dataset.dec){ const id = +b.dataset.dec; setQty(id, (cart[id] || 0) - 1); }
    else if (b.dataset.cat){ view = {cat: b.dataset.cat, q: ""}; $("#q").value = ""; scrollTo({top: 0}); }
    else if ("home" in b.dataset){ view = {cat: null, q: ""}; $("#q").value = ""; $("#clearQ").style.display = "none"; scrollTo({top: 0}); }
    else if ("ask" in b.dataset){ openCart(); setTimeout(() => $("#notes").focus(), 300); return; }
    else if ("rx" in b.dataset){ open(waLink(`السلام عليكم، عايز أبعت روشتة لـ ${S.name} 📋\n(هبعت الصورة دلوقتي)`), "_blank"); return; }
    if (inSheet){ renderCart(); renderBar(); } else render();
  });

  let qt;
  $("#q").addEventListener("input", e => {
    $("#clearQ").style.display = e.target.value ? "block" : "none";
    clearTimeout(qt); qt = setTimeout(() => { view.q = e.target.value; render(); }, 120);
  });
  $("#clearQ").onclick = () => { $("#q").value = ""; view.q = ""; $("#clearQ").style.display = "none"; render(); };

  render();
})();
</script>
</body>
</html>
